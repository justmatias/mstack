id: prefer-httpx-over-requests
language: Python
severity: error
message: Use httpx instead of requests (import httpx; httpx.get(...) or httpx.Client())
note: |
  httpx has one API for sync and async code, timeouts by default
  and HTTP/2 support.
metadata:
  source: .cursor/rules/http-client.mdc
rule:
  any:
    - kind: import_statement
      has:
        stopBy: end
        kind: dotted_name
        regex: ^requests(\.|$)
    - kind: import_from_statement
      has:
        field: module_name
        regex: ^requests(\.|$)
