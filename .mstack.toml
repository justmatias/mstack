# Where this repo keeps its rules and checks. Every `mstack` command reads this file;
# flags still override it. Run `mstack config` to see the resolved values.
rules_dir = "rules"
sgconfig = "lint/sgconfig.yml"
importlinter = ".importlinter"

[scan]
# fixtures/invalid/ breaks every rule on purpose; it is only scanned by `make demo`.
exclude = ["fixtures/invalid/**"]

[leak_check]
paths = ["lint", "rules"]
# Tooling folders, not the analyzed code.
exclude = ["src", "scripts", "tests", "fixtures/invalid"]
