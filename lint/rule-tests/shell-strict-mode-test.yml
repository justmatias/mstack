id: shell-strict-mode
valid:
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    echo "ready"
  # Near miss: strict mode after comments.
  - |
    #!/usr/bin/env bash
    # Build the archive.
    # Usage: build.sh <dir>
    set -Eeuo pipefail
    tar -czf out.tar.gz "$1"
invalid:
  - |
    #!/usr/bin/env bash
    echo "no strict mode"
  - |
    #!/usr/bin/env bash
    set -e
    cp "$1" "$2"
  # Strict mode only inside a function does not cover the script.
  - |
    #!/usr/bin/env bash
    main() {
      set -euo pipefail
      run_task
    }
    main
