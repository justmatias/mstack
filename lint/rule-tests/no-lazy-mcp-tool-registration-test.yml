id: no-lazy-mcp-tool-registration
valid:
  - |
    mcp = FastMCP("foo")
    for tool in TOOLS:
        mcp.add_tool(tool)
  - |
    mcp = FastMCP("foo")
    mcp.add_tool(list_items)


    def run_mcp_server():  # pragma: no cover
        mcp.run()
invalid:
  - |
    def run_mcp_server():
        mcp = FastMCP("foo")
        for tool in TOOLS:
            mcp.add_tool(tool)
        mcp.run()
  - |
    def build_server():
        server = FastMCP("foo")
        server.add_tool(tool=list_items)
        return server
