id: no-print-in-app
language: Python
severity: error
message: Use a module logger (logging.getLogger(__name__)) instead of print
note: |
  print output has no level or source and cannot be filtered
  or routed in production.
metadata:
  source: rules/logging.mdc
files:
  - "**/fixtures/**"
rule:
  pattern: print($$$ARGS)
