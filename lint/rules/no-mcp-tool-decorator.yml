id: no-mcp-tool-decorator
language: Python
severity: error
message: Write the MCP tool as a plain function and register it in mcp/app.py with add_tool
note: |
  An undecorated function can be tested by calling it directly, with no MCP machinery
  or running server.
metadata:
  source: rules/mcp-servers.mdc
files:
  - "**/mcp/**"
rule:
  kind: decorator
  any:
    - pattern: "@$SERVER.tool"
    - pattern: "@$SERVER.tool($$$)"
