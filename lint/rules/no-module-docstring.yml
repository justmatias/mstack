id: no-module-docstring
language: Python
severity: warning
message: Remove the module docstring; document the classes and functions that need it
note: |
  A module docstring restates the file name and drifts from the code below it.
  Class and function docstrings are fine where they add value.
metadata:
  source: rules/python-modules.mdc
rule:
  kind: expression_statement
  inside:
    kind: module
  has:
    kind: string
  nthChild:
    position: 1
    ofRule:
      not:
        kind: comment
