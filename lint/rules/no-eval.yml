id: no-eval
language: Bash
severity: error
message: Don't use eval; build the command as an array and run "${command[@]}"
note: |
  eval runs whatever ends up in the string, so any value that reaches it
  becomes code.
metadata:
  source: rules/shell.mdc
rule:
  kind: command
  has:
    field: name
    regex: "^eval$"
