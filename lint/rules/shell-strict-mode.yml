id: shell-strict-mode
language: Bash
severity: error
message: Add `set -euo pipefail` right after the shebang
note: |
  Without strict mode a failed command, a failed pipe stage or an unset
  variable lets the script continue with bad state.
metadata:
  source: rules/shell.mdc
rule:
  kind: program
  not:
    has:
      kind: command
      any:
        - pattern: set -euo pipefail
        - pattern: set -Eeuo pipefail
