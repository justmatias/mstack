# Hooks other repos use from their .pre-commit-config.yaml, pinned to a release tag.
# pre-commit installs mstack at that tag in its own environment, with ast-grep and
# import-linter as runtime dependencies, so the target repo needs nothing else.
- id: mstack-lint
  name: mstack lint (ast-grep scan of the staged files)
  description: Scan the staged files with the repo's ast-grep rules; warnings fail too.
  entry: mstack lint --only scan --files
  language: python

- id: mstack-rules
  name: mstack rules (rule tests and coverage)
  description: Run the ast-grep rule tests and check that rules and checks point to each other.
  entry: mstack lint --only test coverage
  language: python
  pass_filenames: false
  files: \.(mdc|ya?ml)$

- id: mstack-exceptions
  name: mstack exceptions
  description: Every ast-grep-ignore carries a rule-exception with reason, expiry and approval.
  entry: mstack exceptions
  language: python
  types_or: [python, shell]

- id: mstack-domain-check
  name: mstack domain-check
  description: Rules and checks hold no repo identifiers, URLs, hosts or emails ([domain_check] in .mstack.toml).
  entry: mstack domain-check
  language: python
  pass_filenames: false
  files: \.(mdc|ya?ml)$

- id: mstack-imports
  name: mstack imports (import-linter contracts)
  description: >-
    Check the .importlinter contracts. import-linter must import the project: when it
    needs third-party packages, list them in additional_dependencies.
  entry: mstack lint --only imports
  language: python
  pass_filenames: false
  files: (^|/)\.importlinter$|\.py$

- id: mstack-commit-msg
  name: mstack commit-msg
  description: Commit messages follow Conventional Commits ([commits].types in .mstack.toml).
  entry: mstack commit-msg
  language: python
  stages: [commit-msg]
