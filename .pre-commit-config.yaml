# fixtures/invalid/ holds deliberate violations for the rule checks to catch,
# so the Python linters skip it.
repos:
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 'v0.27'
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.17.5'
    hooks:
      - id: ruff-check
        name: ruff
        args: ['--fix']
        exclude: ^fixtures/invalid/
      - id: ruff-format
        exclude: ^fixtures/invalid/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-r', '-lll']
        exclude: ^fixtures/invalid/

  # Enforces part of rules/shell.mdc (enforced-by-hook: shellcheck).
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^fixtures/invalid/

  - repo: https://github.com/justmatias/hookpin
    rev: v7.0.2
    hooks:
      - id: hookpin

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.1.4
    hooks:
      - id: pylint
        types: [python]
        exclude: ^fixtures/invalid/
        additional_dependencies:
          - pydantic==2.14.4
          - pytest==9.2.0
          - pyyaml==6.0.3
          - types-pyyaml==6.0.12.20261113

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        exclude: ^fixtures/invalid/
        additional_dependencies:
          - pydantic==2.14.4
          - pytest==9.2.0
          - pyyaml==6.0.3
          - types-pyyaml==6.0.12.20261113

  # The repo runs its own rule checks on itself, exactly as CI does.
  - repo: local
    hooks:
      - id: lint-rules
        name: lint-rules (make lint-rules-changed on staged files)
        entry: make lint-rules-changed STAGED=1
        language: system
        pass_filenames: false
        always_run: true
