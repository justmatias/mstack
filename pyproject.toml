[project]
name = "mstack"
version = "7.4.0"
description = "Logbook of agent skills, rules, checks and tools that guide AI coding agents."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Matias Gimenez", email = "matiasgimenez.dev@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
mstack = "mstack.cli:main"

[project.urls]
repository = "https://github.com/justmatias/mstack"

[dependency-groups]
# rulepack lints this repo and brings ast-grep for the checks' tests. mstack's
# code never imports it.
dev = [
    "poethepoet>=0.49.0",
    "pre-commit>=4",
    "pytest",
    "rulepack @ git+https://github.com/justmatias/rulepack@v0.7.0",
    "types-pyyaml",
]

# The repo's commands, the same on every OS: `uv run poe <task>`. pre-commit and CI
# call lint-rules, lint-rules-changed or lint-rules-staged and nothing else.
[tool.poe.tasks]
lint = { cmd = "pre-commit run --all-files", help = "Every pre-commit hook on every file" }
test = { cmd = "pytest -q", help = "The test suite" }

[tool.poe.tasks.repo-guards]
default_item_type = "cmd"
help = "Guards rulepack lint does not run: rules match checks, skills, rule tests"
sequence = [
    "mstack coverage --rules-dir rules",
    "mstack skills-check skills .agents/skills",
    "mstack rule-tests-check --sgconfig lint/sgconfig.yml",
]

[tool.poe.tasks.lint-rules]
default_item_type = "cmd"
help = "rulepack lint (check tests, full scan, import-linter) and the guards"
sequence = ["rulepack lint", { ref = "repo-guards" }]

# On changed files every rule fails, warnings included: only new or touched code has
# to follow new rules. CI sets BASE_REF=origin/<base branch> on pull requests.
[tool.poe.tasks.lint-rules-changed]
default_item_type = "cmd"
help = "Like lint-rules, but the scan only covers files changed from BASE_REF"
sequence = ["rulepack lint --changed --base-ref ${BASE_REF}", { ref = "repo-guards" }]
env.BASE_REF.default = "origin/main"

[tool.poe.tasks.lint-rules-staged]
default_item_type = "cmd"
help = "Like lint-rules-changed, on the staged files (the pre-commit hook)"
sequence = ["rulepack lint --changed --staged", { ref = "repo-guards" }]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mstack"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/mstack",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fixtures/ holds sample tests for the rule checks (some break them on purpose).
norecursedirs = ["fixtures"]

# The rulepack version that setup-mstack installs and doctor names in its fix.
[tool.mstack]
rulepack = "v0.7.0"

##################################
# ruff configuration             #
##################################

[tool.ruff]
line-length = 88
# fixtures/invalid/ holds deliberate violations for the rule checks to catch.
extend-exclude = ["fixtures/invalid"]
preview = true
fix = true
# T20: no print() left in code; use logging (replaces the old no-print-in-app check).
lint.extend-select = ["T20"]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false

##################################
# pylint configuration           #
##################################

[tool.pylint]
ignore-paths = ["^fixtures/invalid/.*$"]
disable = [
  "missing-docstring",
  "missing-module-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
  "astroid-error",
  "consider-using-assignment-expr",
  "redefined-outer-name",
  "broad-exception-caught",
  "import-error",
]

load-plugins = [
  "pylint.extensions.bad_builtin",
  "pylint.extensions.code_style",
  "pylint.extensions.comparison_placement",
  "pylint.extensions.consider_refactoring_into_while_condition",
  "pylint.extensions.dunder",
  "pylint.extensions.eq_without_hash",
  "pylint.extensions.for_any_all",
  "pylint.extensions.mccabe",
  "pylint.extensions.no_self_use",
  "pylint.extensions.overlapping_exceptions",
  "pylint.extensions.private_import",
  "pylint.extensions.redefined_loop_name",
  "pylint.extensions.set_membership",
]

##################################
# mypy configuration             #
##################################

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
exclude = ["^fixtures/invalid/"]
disallow_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
disable_error_code = ["var-annotated"]

# Tests take pytest fixtures as parameters; annotating each one adds noise.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
warn_return_any = false

##################################
# semantic release configuration #
##################################

[tool.semantic_release]
branch = "main"
commit_message = "chore(release): release version {version}"
version_toml = ["pyproject.toml:project.version"]
build_command = "uv lock --upgrade-package mstack && git add uv.lock"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false
