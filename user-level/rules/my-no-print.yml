id: my-no-print
language: Python
severity: error
message: Use a module logger (logging.getLogger(__name__)) instead of print
note: |
  Personal rule. print output has no level or source and is easy to
  leave behind after debugging.
metadata:
  source: ~/.cursor/rules/my-no-print.mdc
ignores:
  - "**/tests/**"
  - "**/scripts/**"
rule:
  pattern: print($$$ARGS)
