name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Read-only by default: these jobs run code from the PR branch. Only the
# versioning job gets write access.
permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      # Every pre-commit hook on every file except this repo's own lint-rules
      # hook: it scans staged files only, so on a clean checkout it scans
      # nothing. The next two steps run the rules properly. no-commit-to-branch
      # guards local commits; CI checks out main on every push to it.
      - name: Run pre-commit on all files
        env:
          SKIP: lint-rules,no-commit-to-branch
        run: make lint

      - name: Scan the whole repo with the rules
        run: make lint-rules

      # The full scan above does not fail on warning-level rules (old instances
      # are tolerated). On a pull request, every rule, warnings included, must
      # pass on the files the PR changes. fetch-depth: 0 above makes
      # origin/<base branch> available; the target fails if it is missing.
      - name: Scan the files changed by the PR, warnings included
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: make lint-rules-changed

      # Includes test_every_invalid_fixture_is_caught: each file in
      # fixtures/invalid/ must still be flagged, so the checks can't go silent.
      - name: Tests
        run: make test

  # The CLI and the checks must behave the same on every OS. `make` is a
  # contributor convenience (bash), so this job calls pytest and rulepack directly.
  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Tests
        run: uv run pytest -q

      - name: rulepack lint
        run: uv run rulepack lint

      - name: mstack coverage
        run: uv run mstack coverage --rules-dir rules

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      # Audit what uv.lock pins. `uvx pip-audit --local` would audit pip-audit's
      # own isolated environment instead of the project's dependencies.
      - name: Run pip-audit on the locked dependencies
        run: |
          requirements="$RUNNER_TEMP/requirements-audit.txt"
          uv export --frozen --all-groups --no-emit-project --no-emit-package rulepack --format requirements-txt -o "$requirements"
          uvx pip-audit -r "$requirements" --disable-pip --require-hashes

  versioning:
    name: Versioning
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, portability, security]
    # The release commit already arrived through the PR (release-prepare.yml).
    # This job only tags it and creates the GitHub release; tags are not
    # covered by the branch ruleset, so no push to main is needed.
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Tag the version in pyproject.toml and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists; nothing to release."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag "$tag"
          git push origin "refs/tags/${tag}"
          gh release create "$tag" --verify-tag --generate-notes
