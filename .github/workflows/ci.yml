name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-checks:
    name: Static checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      # Every pre-commit hook on every file, including this repo's own
      # lint-rules hook: the toolkit checks itself.
      - name: Run pre-commit on all files
        run: make lint

      # The pre-commit hook scans staged files only, so on a clean checkout it
      # scans nothing: scan the whole repo here.
      - name: Scan the code with the rules
        run: make lint-rules

      # The full scan above does not fail on warning-level rules (old instances
      # are tolerated). On a pull request, every rule, warnings included, must
      # pass on the files the PR changes. fetch-depth: 0 above makes
      # origin/<base branch> available; the target fails if it is missing.
      - name: Scan the files changed by the PR, warnings included
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: make lint-rules-changed

      - name: The checks still catch the invalid fixtures
        run: make demo

      - name: Tests
        run: make test

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Run pip-audit
        run: uvx pip-audit --local

  versioning:
    name: Versioning
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, security]
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      # Run semantic-release through uvx rather than its Docker action: the
      # build_command relocks uv.lock after the version bump, which needs uv.
      - name: Bump version, update changelog, tag and release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          uvx --from python-semantic-release semantic-release version
