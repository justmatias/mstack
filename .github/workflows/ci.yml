name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Read-only by default: these jobs run code from the PR branch. Only the
# versioning job gets write access.
permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      # Every pre-commit hook on every file except this repo's own lint-rules
      # hook: it scans staged files only, so on a clean checkout it scans
      # nothing. The next two steps run the rules properly. no-commit-to-branch
      # guards local commits; CI checks out main on every push to it.
      - name: Run pre-commit on all files
        env:
          SKIP: lint-rules,no-commit-to-branch
        run: make lint

      - name: Scan the whole repo with the rules
        run: make lint-rules

      # The full scan above does not fail on warning-level rules (old instances
      # are tolerated). On a pull request, every rule, warnings included, must
      # pass on the files the PR changes. fetch-depth: 0 above makes
      # origin/<base branch> available; the target fails if it is missing.
      - name: Scan the files changed by the PR, warnings included
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: make lint-rules-changed

      # commit-msg hooks don't run with --all-files: check every commit the PR
      # adds, one message at a time, with the same command.
      - name: Check the PR's commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          message="$RUNNER_TEMP/commit-message"
          failed=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$message"
            if ! uv run mstack commit-msg "$message"; then
              echo "commit $sha has a non-conventional message" >&2
              failed=1
            fi
          done
          exit "$failed"

      # Includes test_every_invalid_fixture_is_caught: each file in
      # fixtures/invalid/ must still be flagged, so the checks can't go silent.
      - name: Tests
        run: make test

      # The slow tests install the hooks in .pre-commit-hooks.yaml from this
      # checkout with `pre-commit try-repo`, as another repo would.
      - name: Slow tests (pre-commit hooks from a clean environment)
        run: uv run pytest -q -m slow

  # Runs the reusable action (action.yml) on this repo, as another repo would,
  # so a broken action fails here first.
  action-self-test:
    name: Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run the mstack lint action
        uses: ./

  # The CLI and the checks must behave the same on every OS. `make` is a
  # contributor convenience (bash), so this job calls pytest and mstack directly.
  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Tests
        run: uv run pytest -q

      - name: mstack lint
        run: uv run mstack lint

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      # Audit what uv.lock pins. `uvx pip-audit --local` would audit pip-audit's
      # own isolated environment instead of the project's dependencies.
      - name: Run pip-audit on the locked dependencies
        run: |
          requirements="$RUNNER_TEMP/requirements-audit.txt"
          uv export --frozen --all-groups --no-emit-project --format requirements-txt -o "$requirements"
          uvx pip-audit -r "$requirements" --disable-pip --require-hashes

  versioning:
    name: Versioning
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, action-self-test, portability, security]
    # Pushes the release commit and tag, and creates the GitHub release.
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      # Run semantic-release through uvx rather than its Docker action: the
      # build_command relocks uv.lock after the version bump, which needs uv.
      - name: Bump version, update changelog, tag and release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          uvx --from python-semantic-release semantic-release version

      # Callers of the action may pin `@v<major>` to follow fixes. Move that tag
      # to the release just made; skip when semantic-release made no release.
      - name: Move the major version tag
        run: |
          tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n 1)"
          if [[ -z "$tag" ]]; then
            echo "No release tag on HEAD; the major tag stays where it is."
            exit 0
          fi
          major="${tag%%.*}"
          git tag --force "$major" "$tag"
          git push --force origin "refs/tags/$major"
