# Where this repo keeps its rules and checks (written by `mstack init`). Every
# `mstack` command reads this file; run `mstack config` to see the resolved values.
rules_dir = "{{rules_dir}}"
sgconfig = "{{checks_dir}}/sgconfig.yml"

[scan]
exclude = []

[domain_check]
paths = ["{{checks_dir}}", "{{rules_dir}}"]
